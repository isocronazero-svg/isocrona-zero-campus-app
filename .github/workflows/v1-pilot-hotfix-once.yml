name: V1 pilot hotfix once

on:
  push:
    branches:
      - fix/v1-enrollment-close-status
    paths:
      - .github/workflows/v1-pilot-hotfix-once.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-enrollment-close-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pilot fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("public/app.js")
          text = path.read_text()
          original = text

          # #282: effective enrollment deadline must be reflected for admin too.
          old = 'role === "member" && EnrollmentTime.courseWindowState(course) === "closed"'
          if old not in text:
              raise SystemExit("#282 target not found")
          text = text.replace(old, 'EnrollmentTime.courseWindowState(course) === "closed"', 1)
          text = text.replace(
              '<strong>${escapeHtml(course.status)}</strong>',
              '<strong>${escapeHtml(EnrollmentTime.courseWindowState(course) === "closed" ? "Inscripción cerrada" : course.status)}</strong>',
              1,
          )
          text = text.replace(
              '<tr><td>Estado</td><td>${escapeHtml(course.status)}</td></tr>',
              '<tr><td>Estado</td><td>${escapeHtml(EnrollmentTime.courseWindowState(course) === "closed" ? "Inscripción cerrada" : course.status)}</td></tr>',
              1,
          )

          # #279: 50/30 are the only fee choices; 50 is the default real value.
          old = '<input id="associatePaymentSubmissionAmount" type="number" min="1" step="1" placeholder="50" />'
          new = '<select id="associatePaymentSubmissionAmount">\n                <option value="50" selected>50 € — Cuota general</option>\n                <option value="30">30 € — Cuota reducida</option>\n              </select>'
          if old not in text:
              raise SystemExit("#279 target not found")
          text = text.replace(old, new, 1)

          # #280: preserve the current member selection across state refreshes.
          pattern = re.compile(
              r'(?m)^  const activeView = hasLoaded \? state\.activeView : null;\n'
              r'  state = normalizeState\(payload\);\n'
              r'  if \(activeView\) \{\n'
              r'    state\.activeView = activeView;\n'
              r'  \}\n'
              r'  storageMeta = await loadStorageMeta\(\);'
          )
          replacement = (
              '  const activeView = hasLoaded ? state.activeView : null;\n'
              '  const selectedAssociateId = hasLoaded ? state.selectedAssociateId : null;\n'
              '  state = normalizeState(payload);\n'
              '  if (activeView) {\n'
              '    state.activeView = activeView;\n'
              '  }\n'
              '  if (selectedAssociateId && (state.associates || []).some((associate) => associate.id === selectedAssociateId)) {\n'
              '    state.selectedAssociateId = selectedAssociateId;\n'
              '  }\n'
              '  storageMeta = await loadStorageMeta();'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"#280 target count={count}")

          # #281: do not destroy/recreate the search input on every keystroke.
          listener = text.index('document.addEventListener("input", (event) => {')
          start = text.index('  if (event.target.id === "associateSearchFilter") {', listener)
          end = text.index('\n  }\n', start) + len('\n  }')
          old_block = text[start:end]
          if 'pendingInputFocusRestore' not in old_block or 'render();' not in old_block:
              raise SystemExit("#281 unexpected search handler")
          new_block = (
              '  if (event.target.id === "associateSearchFilter") {\n'
              '    associateFilters.query = event.target.value || "";\n'
              '    resetAssociatePages();\n'
              '    // Keep the input mounted while typing. Search runs with Enter or the Buscar action.\n'
              '    return;\n'
              '  }'
          )
          text = text[:start] + new_block + text[end:]

          if text == original:
              raise SystemExit("No changes produced")
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate app
        run: npm run check:app
      - name: Static regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("public/app.js").read_text()
          assert 'role === "member" && EnrollmentTime.courseWindowState(course) === "closed"' not in text
          assert '<option value="50" selected>50 € — Cuota general</option>' in text
          assert '<option value="30">30 € — Cuota reducida</option>' in text
          assert 'const selectedAssociateId = hasLoaded ? state.selectedAssociateId : null;' in text
          listener = text.index('document.addEventListener("input", (event) => {')
          start = text.index('if (event.target.id === "associateSearchFilter") {', listener)
          end = text.index('return;', start)
          assert 'render();' not in text[start:end]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-pilot-hotfix-app
          path: public/app.js
          if-no-files-found: error
