name: V1 pilot hotfix once

on:
  push:
    branches:
      - fix/v1-enrollment-close-status
    paths:
      - .github/workflows/v1-pilot-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-enrollment-close-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pilot fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("public/app.js")
          text = path.read_text()
          original = text

          # #282 — visual state must follow the effective enrollment window for admin too.
          old = 'role === "member" && EnrollmentTime.courseWindowState(course) === "closed"'
          if old not in text:
              raise SystemExit("#282 target not found")
          text = text.replace(old, 'EnrollmentTime.courseWindowState(course) === "closed"', 1)

          # Keep the two detailed admin course views aligned with the effective deadline.
          text = text.replace(
              '<strong>${escapeHtml(course.status)}</strong>',
              '<strong>${escapeHtml(EnrollmentTime.courseWindowState(course) === "closed" ? "Inscripción cerrada" : course.status)}</strong>',
              1,
          )
          text = text.replace(
              '<tr><td>Estado</td><td>${escapeHtml(course.status)}</td></tr>',
              '<tr><td>Estado</td><td>${escapeHtml(EnrollmentTime.courseWindowState(course) === "closed" ? "Inscripción cerrada" : course.status)}</td></tr>',
              1,
          )

          # #279 — the fee is a real selected value, not a placeholder.
          old = '<input id="associatePaymentSubmissionAmount" type="number" min="1" step="1" placeholder="50" />'
          new = '''<select id="associatePaymentSubmissionAmount">
                <option value="50" selected>50 € — Cuota general</option>
                <option value="30">30 € — Cuota reducida</option>
              </select>'''
          if old not in text:
              raise SystemExit("#279 target not found")
          text = text.replace(old, new, 1)

          # #280 — /api/state is server-owned and may carry a stale UI selection.
          # Preserve the current member ficha across refreshes when it still exists.
          old = '''  const activeView = hasLoaded ? state.activeView : null;
  state = normalizeState(payload);
  if (activeView) {
    state.activeView = activeView;
  }
  storageMeta = await loadStorageMeta();'''
          new = '''  const activeView = hasLoaded ? state.activeView : null;
  const selectedAssociateId = hasLoaded ? state.selectedAssociateId : null;
  state = normalizeState(payload);
  if (activeView) {
    state.activeView = activeView;
  }
  if (selectedAssociateId && (state.associates || []).some((associate) => associate.id === selectedAssociateId)) {
    state.selectedAssociateId = selectedAssociateId;
  }
  storageMeta = await loadStorageMeta();'''
          if old not in text:
              raise SystemExit("#280 target not found")
          text = text.replace(old, new, 1)

          # #281 — typing in the member search must not rebuild the whole view on each key.
          old = '''  if (event.target.id === "associateSearchFilter") {
      associateFilters.query = event.target.value || "";
      resetAssociatePages();
    pendingInputFocusRestore = {
      id: event.target.id,
      start: typeof event.target.selectionStart === "number" ? event.target.selectionStart : null,
      end: typeof event.target.selectionEnd === "number" ? event.target.selectionEnd : null
    };
    render();
    return;
  }'''
          new = '''  if (event.target.id === "associateSearchFilter") {
    associateFilters.query = event.target.value || "";
    resetAssociatePages();
    // Keep the input mounted while typing. Search is executed with Enter or the Buscar action.
    return;
  }'''
          if old not in text:
              raise SystemExit("#281 target not found")
          text = text.replace(old, new, 1)

          if text == original:
              raise SystemExit("No changes produced")
          path.write_text(text)

      - name: Install dependencies
        run: npm ci
      - name: Validate app
        run: npm run check:app
      - name: Static regression checks
        shell: python
        run: |
          from pathlib import Path
          text = Path("public/app.js").read_text()
          assert 'role === "member" && EnrollmentTime.courseWindowState(course) === "closed"' not in text
          assert '<option value="50" selected>50 € — Cuota general</option>' in text
          assert '<option value="30">30 € — Cuota reducida</option>' in text
          assert 'const selectedAssociateId = hasLoaded ? state.selectedAssociateId : null;' in text
          block = text.split('if (event.target.id === "associateSearchFilter") {', 1)[1].split('return;', 1)[0]
          assert 'render();' not in block
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/v1-pilot-hotfix-once.yml
          git config user.name "isocronazero-v1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js .github/workflows/v1-pilot-hotfix-once.yml
          git commit -m "fix: stabilize v1 pilot enrollment and member admin UX"
          git push origin HEAD:fix/v1-enrollment-close-status
