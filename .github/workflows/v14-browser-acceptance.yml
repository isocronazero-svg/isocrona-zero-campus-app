name: V1.4 isolated browser acceptance

on:
  push:
    branches:
      - feature/v1.4-release-candidate
  pull_request:
    paths:
      - 'public/**'
      - 'tests/browser/v14-portal.spec.mjs'
      - '.github/workflows/v14-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      IZ_SKIP_WEBKIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V1.4 browser acceptance on isolated synthetic data
        run: npx playwright test tests/browser/v14-portal.spec.mjs --config=playwright.config.mjs
      - name: Save browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-browser-evidence
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
