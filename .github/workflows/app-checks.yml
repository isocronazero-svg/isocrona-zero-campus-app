name: App checks

on:
  pull_request:
    branches:
      - main
      - feature/v1.1
      - feature/v1.2
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: Run app safety and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IZ_DATA_DIR: /tmp/isocrona-campus-data
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full app safety checks
        run: npm run check:app

      - name: Start app server for smoke checks
        run: |
          mkdir -p "$IZ_DATA_DIR"
          npm run start:local > /tmp/isocrona-campus.log 2>&1 &
          echo $! > /tmp/isocrona-campus.pid
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3210/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat /tmp/isocrona-campus.log
          exit 1

      - name: Run campus smoke checks
        run: npm run smoke:campus-test

      - name: Stop app server
        if: always()
        run: |
          if [ -f /tmp/isocrona-campus.pid ]; then
            kill $(cat /tmp/isocrona-campus.pid) || true
          fi

  postgres-security:
    name: PostgreSQL session and recovery regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: iz_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_test -d iz_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise real PostgreSQL and server restarts
        run: npm run check:postgres-security
        env:
          TEST_DATABASE_URL: postgresql://security_test:disposable_ci_password@127.0.0.1:5432/iz_security_ci

  browser-qa:
    name: V1.2 browser recovery and access checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile recovery with synthetic accounts
        run: npm run check:browser
      - name: Preserve synthetic QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.2-browser-qa
          path: playwright-report/
          retention-days: 7
